name: Mobile frontend build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use NodeJS 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'yarn'

    - name: Install Dependencies
      run: yarn install

    - name: Export mobile frontend (build validation)
      run: npx nx export mobile-frontend
